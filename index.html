<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn App</title>

  <style>
    body {
      font-family: system-ui, Arial;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary { background: #3b82f6; color: white; }
    .success { background: #10b981; color: white; }
    .danger { background: #ef4444; color: white; }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
    }

    .idBox {
      font-size: 12px;
      word-break: break-all;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Earn Dashboard</h2>
    <div>ID:</div>
    <div id="telegramId" class="idBox"></div>
    <br>
    <div><strong>Balance:</strong></div>
    <h3 id="balance">Loading...</h3>
  </div>

  <div class="card">
    <h2>Daily Bonus</h2>
    <button class="success" onclick="claimDaily()">Claim Daily Reward</button>
    <div id="dailyMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Withdraw</h2>
    <input id="withdrawAmount" type="number" placeholder="Enter amount in points">
    <button class="danger" onclick="requestWithdraw()">Request Withdrawal</button>
    <div id="withdrawMsg" class="msg"></div>
  </div>

  <script>
    let telegram_id = new URLSearchParams(window.location.search).get("telegram_id");

    if (!telegram_id) {
      telegram_id = prompt("Enter your Telegram ID:");
    }

    document.getElementById("telegramId").innerText = telegram_id;

    async function loadUser() {
      const r = await fetch(`/api/me?telegram_id=${telegram_id}`);
      const data = await r.json();

      if (!r.ok) {
        document.getElementById("balance").innerText = "Error loading";
        return;
      }

      document.getElementById("balance").innerText = data.user.balance + " Points";
    }

    async function claimDaily() {
      const msg = document.getElementById("dailyMsg");
      msg.innerText = "Processing...";

      const r = await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id })
      });

      const data = await r.json();

      if (!r.ok) {
        msg.innerText = "❌ " + data.error;
        return;
      }

      msg.innerText = "✅ +" + data.reward + " points added!";
      loadUser();
    }

    async function requestWithdraw() {
      const amount = parseInt(document.getElementById("withdrawAmount").value);
      const msg = document.getElementById("withdrawMsg");

      if (!amount || amount <= 0) {
        msg.innerText = "Enter valid amount";
        return;
      }

      msg.innerText = "Submitting...";

      const r = await fetch("/api/request-withdrawal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id, amount })
      });

      const data = await r.json();

      if (!r.ok) {
        msg.innerText = "❌ " + data.error;
        return;
      }

      msg.innerText = "✅ Withdrawal requested";
      document.getElementById("withdrawAmount").value = "";
    }

    loadUser();
  </script>

</body>
</html>
