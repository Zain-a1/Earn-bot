<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Earn Bot</title>

  <style>
    :root{
      --bg:#0b1020; --card:#121a33; --muted:#9fb0ff; --text:#e8ecff;
      --good:#39d98a; --bad:#ff5c7a; --warn:#ffd166; --line:#223062;
      --btn:#4c6fff; --btn2:#2a345c;
    }

    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    body{margin:0;background:linear-gradient(180deg,#070b18, var(--bg));color:var(--text);}
    .wrap{max-width:920px;margin:0 auto;padding:18px;}
    .top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
    .brand{font-weight:800;letter-spacing:.3px;font-size:18px}
    .pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .card{background:rgba(18,26,51,.85);border:1px solid var(--line);border-radius:14px;padding:14px}
    .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .h h2{margin:0;font-size:14px;color:var(--muted);font-weight:700}
    .big{font-size:34px;font-weight:900;letter-spacing:.2px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a1026;color:var(--text)}
    button{padding:12px 14px;border:0;border-radius:10px;background:var(--btn);color:white;font-weight:800;cursor:pointer}
    button.secondary{background:var(--btn2);border:1px solid var(--line)}
    button.green{background:var(--good);color:#000}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px;border-bottom:1px solid rgba(34,48,98,.6);text-align:left}
    th{color:var(--muted);font-weight:800;font-size:12px}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}
    .pending{background:rgba(255,209,102,.15);color:var(--warn);border:1px solid rgba(255,209,102,.25)}
    .approved{background:rgba(57,217,138,.15);color:var(--good);border:1px solid rgba(57,217,138,.25)}
    .rejected{background:rgba(255,92,122,.15);color:var(--bad);border:1px solid rgba(255,92,122,.25)}
    .muted{color:var(--muted)}
    .small{font-size:12px;color:var(--muted)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:600px){.split{grid-template-columns:1fr}}
    .banner{margin:15px 0;text-align:center}
    .hook{font-size:13px;color:var(--good);margin-top:6px}
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">Earn Bot</div>
    <div class="pill">Status: <span id="statusTxt">Idle</span></div>
  </div>

  <!-- 🔥 TOP BANNER AD -->
  <div class="banner">
    <!-- PASTE MONETAG TOP BANNER CODE HERE (728x90 or 320x100 mobile) -->
  </div>

  <div class="grid">

    <!-- MAIN BALANCE CARD -->
    <div class="card">
      <div class="h">
        <h2>Your Balance</h2>
        <span class="small" id="userLine">Not loaded</span>
      </div>

      <div class="big" id="balance">—</div>
      <div class="hook" id="hookLine">🚀 Start earning today!</div>
      <div class="msg" id="msg"></div>

      <div style="height:12px"></div>

      <!-- DAILY BONUS -->
      <div class="card" style="background:#0f1838;margin-bottom:12px">
        <div class="h">
          <h2>Daily Bonus</h2>
        </div>
        <button class="green" onclick="claimDaily()">Claim Daily Reward</button>
        <div class="small" id="dailyMsg"></div>
      </div>

      <div class="split">
        <div>
          <div class="small">Telegram ID</div>
          <input id="tid" placeholder="Auto if opened in Telegram" />
        </div>
        <div>
          <div class="small">Withdraw amount (points)</div>
          <input id="amount" placeholder="e.g. 2000" inputmode="numeric" />
        </div>
      </div>

      <div style="height:10px"></div>
      <div class="row">
        <button id="btnLoad" class="secondary">Load</button>
        <button id="btnWithdraw">Request Withdrawal</button>
      </div>
    </div>

    <!-- INFO CARD -->
    <div class="card">
      <div class="h"><h2>How to Earn</h2></div>
      <div class="small">
        🔥 Claim daily rewards<br/>
        🎯 Complete tasks<br/>
        💰 Withdraw when ready<br/><br/>
        The more active you are, the faster you grow.
      </div>
    </div>

    <!-- HISTORY -->
    <div class="card" style="grid-column:1/-1">
      <div class="h">
        <h2>Withdrawal History</h2>
        <button id="btnRefresh" class="secondary">Refresh</button>
      </div>
      <div id="tableWrap" class="muted">No data yet.</div>
    </div>

  </div>

  <!-- 🔥 BOTTOM BANNER AD -->
  <div class="banner">
    <!-- PASTE MONETAG BOTTOM BANNER CODE HERE (300x250 recommended) -->
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const setStatus = (t) => $("statusTxt").textContent = t;
const msg = (t) => $("msg").textContent = t || "";

function getTelegramIdFromTelegramWebApp(){
  try{
    const tg = window.Telegram?.WebApp;
    const uid = tg?.initDataUnsafe?.user?.id;
    if (uid) return String(uid);
  }catch(e){}
  return "";
}

async function apiGet(path){
  const r = await fetch(path);
  return r.json();
}

async function apiPost(path, body){
  const r = await fetch(path,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  return r.json();
}

async function loadUser(){
  const telegram_id = $("tid").value.trim();
  if(!telegram_id){ msg("Telegram ID missing."); return; }

  setStatus("Loading...");
  const data = await apiGet(`/api/me?telegram_id=${encodeURIComponent(telegram_id)}`);

  if(!data.ok){
    setStatus("Error");
    msg(data.error || "Error loading user");
    return;
  }

  const u = data.user;
  $("balance").textContent = Number(u.balance || 0);
  $("userLine").textContent = `@${u.username || "no-username"} • ${u.telegram_id}`;
  $("hookLine").textContent = `🔥 You are earning faster than 62% of users today.`;

  setStatus("Ready");
}

async function claimDaily(){
  const telegram_id = $("tid").value.trim();
  if(!telegram_id){ $("dailyMsg").textContent="Telegram ID missing."; return; }

  $("dailyMsg").textContent="Processing...";
  const data = await apiPost("/api/daily",{telegram_id});

  if(!data.ok){
    $("dailyMsg").textContent="❌ "+data.error;
    return;
  }

  $("dailyMsg").textContent="✅ +" + data.reward + " points added!";
  loadUser();
}

async function requestWithdraw(){
  const telegram_id = $("tid").value.trim();
  const amount = Number($("amount").value.trim());
  if(!telegram_id || !amount) return;

  const data = await apiPost("/api/withdraw",{telegram_id,amount});
  if(!data.ok){ msg(data.error); return; }

  msg("Withdrawal requested successfully.");
  loadUser();
}

const autoTid = getTelegramIdFromTelegramWebApp();
if(autoTid) $("tid").value = autoTid;

$("btnLoad").onclick = loadUser;
$("btnWithdraw").onclick = requestWithdraw;
$("btnRefresh").onclick = loadUser;

if(autoTid) loadUser();
</script>

</body>
</html>
